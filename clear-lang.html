<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear Language Cache</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0b0d14;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: #1a1d2d;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        button {
            background: #9333ea;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background: #a855f7;
        }
        .success {
            color: #2ed573;
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Clear Language Cache</h1>
        <p>Click the button below to clear the language cache and reset to English.</p>
        <button onclick="clearLanguageCache()">Clear Cache & Set to English</button>
        <div id="message"></div>
    </div>

    <script>
        function clearLanguageCache() {
            localStorage.removeItem('droplet_dashboard_lang');
            localStorage.setItem('droplet_dashboard_lang', 'en');
            document.getElementById('message').innerHTML = '<div class="success">✓ Language cache cleared! Now set to English.<br>Please refresh your dashboard page.</div>';
        }
    </script>
</body>
</html>
