services:
  - type: worker
    name: droplet-bot
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LOG_CHANNEL_ID
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: CODE_CHANNEL_IDS
        value: ""
      - key: MCP_SERVER_URL
        sync: false
      - key: MCP_COMMAND
        sync: false
      - key: MCP_ARGS
        sync: false
      - key: MCP_AUTH_TOKEN
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false

  - type: web
    name: droplet-dashboard
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install
    startCommand: node src/index.js
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DISCORD_TOKEN
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: SESSION_SECRET
        generateValue: true

