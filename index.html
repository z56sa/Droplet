<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Droplet - نظام إدارة المجتمعات السحابية</title>
    <link rel="stylesheet" href="style.css">
    <!-- يجب إضافة خط عربي احترافي هنا (مثل Google Fonts: Tajawal, Cairo) -->
</head>
<body>

    <!-- 1. شريط التنقل العلوي (Header/Navigation Bar) - للتنقل الأساسي -->
    <header class="navbar">
        <div class="logo">Droplet</div>
        <nav>
            <a href="#features">الميزات</a>
            <a href="#pricing">الأسعار</a>
            <!-- يمكن إضافة المزيد من الروابط هنا -->
        </nav>
        <button class="btn-login" onclick="window.location.href='#dashboard'">تسجيل الدخول/التسجيل</button>
    </header>

    <!-- 2. القسم الرئيسي (Hero Section) - مركز الاهتمام وتحويل المستخدمين -->
    <section class="hero-container" id="home">
        <div class="content-wrapper">
            <h1>اصنع مجتمعاً متكاملاً مع <span class="bot-name">Droplet</span></h1>
            <p class="description">نظام سحابي يمنحك أفضل الأدوات الإدارية، أدوات الاقتصاد المتقدمة، أنظمة التذاكر المتكاملة، ومراقبة المجتمع الآلية بكل سهولة واحترافية.</p>

            <!-- مجموعة الأزرار (CTA Group) - أهم جزء في التحويل -->
            <div class="cta-group">
                <button class="primary-btn" onclick="window.location.href='#join'">دعوة الانضمام الآن</button>
                <button class="secondary-btn" onclick="window.location.href='#dashboard'">لوحة التحكم المتقدمة</button>
            </div>
        </div>
    </section>

    <!-- 3. أقسام المحتوى الأخرى (لإثبات أن الموقع طويل) -->
    <section id="features" class="content-section">
        <h2>ميزاتنا الرئيسية</h2>
        <!-- هنا يتم وضع بطاقات الميزات باستخدام CSS Grid/Flexbox لاحقاً -->
    </section>

    <footer class="site-footer">
        &copy; 2026 Droplet. جميع الحقوق محفوظة.
    </footer>
</body>
</html>
